# 陈恪在生人物种表中的定义；由剧情初始化时登记。
# 凡人档、不抽真炁；死亡规则 never 让他在冢前不会被打死；brain = false：生人大脑不接管，由比试控制器驱动。
[species."meridian_story:chen_ke"]
template = "human:adult"
default_tier = "wandering_qi"
death_rule = "never"
brain = false

[species."meridian_story:chen_ke".profile]
true_qi_base_probability = 0.0
opening_count_multiplier = 1.0
fill_multiplier = 1.0
wall_fill_multiplier = 1.0
arm_opening_weight = 1.0
foot_opening_weight = 1.0
