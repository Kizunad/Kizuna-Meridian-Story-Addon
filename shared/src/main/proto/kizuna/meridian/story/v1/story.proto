syntax = "proto3";
package kizuna.meridian.story.v1;
option java_package = "dev.kizuna.meridian.story.protocol.pb";
option java_outer_classname = "StoryMessages";

message Progress {
  int32 schema = 1;
  map<string, LineState> lines = 2;
  GraveKeeper grave = 3;
  RoadTravel road = 4;
  Roadside roadside = 5;
  FateJourney fate = 6;
  RoadTravel footman_road = 7;
  map<string, MarketVisit> market_visits = 8;
  int64 market_rest_until = 9;
}

// 命格事件的演员一经派出便沿用原 UUID，等待区块加载时不会另派一人。
message FateJourney {
  string actor = 1;
  optional int64 gate = 2;
  optional int64 temple = 3;
  bool ambushed = 4;
  bool blood = 5;
  int64 grieving_until = 6;
  string deceased = 7;
  int64 request = 8;
  string hired = 9;
}

// 路段按水平网格记忆；存档保存本签和进度，离线时间不折成脚程。
message RoadTravel {
  optional int64 camp = 1;
  repeated int64 segments = 2;
  int32 segment_ticks = 3;
  int32 walking_ticks = 4;
  int64 draws = 5;
  bool waiting = 6;
  int64 last_settlement = 7;
  optional int64 current_segment = 8;
  int64 diverted_request = 9;
}

message LineState {
  string chapter = 1;
  int64 started_at = 2;
  int64 entered_at = 3;
  int64 revision = 4;
  map<string, string> outcomes = 5;
  int32 last_encounter = 6;
  string ending = 7;
  map<string, Claim> claims = 8;
}

message Claim {
  string chapter = 1;
  int32 encounter = 2;
  string dimension = 3;
  double x = 4;
  double y = 5;
  double z = 6;
  bool spent = 7;
  bool awaiting_delivery = 8;
  optional int64 lore_x = 9;
  optional int64 lore_y = 10;
  optional int64 lore_z = 11;
}

// 陈恪口授时有式被功法库拒绝那一刻的境界和已开经脉数；两者之一有变化他才再来补授。
message RivalRefusal {
  int32 realm = 1;
  int64 opened = 2;
}

// 每名守墓人的剑号、开局投递和回访事实；祖冢位置由主世界单独登记。
// 陈恪试剑：破架后待口授、上次中止那一刻的在线刻数、已口授的寻隙式（按卷内顺序每式一位）、上次口授被拒的情形；
// 比试本身只在内存。
message GraveKeeper {
  string sword_serial = 1;
  int32 delivered = 2;
  int64 last_vigil = 3;
  bool first_swept = 4;
  int64 last_draw = 5;
  int32 visits = 6;
  string lot = 7;
  int32 last_fragment = 8;
  bool upper_received = 9;
  bool lower_received = 10;
  bool rival_won = 11;
  optional int64 rival_setback = 12;
  int32 rival_taught = 13;
  RivalRefusal rival_refusal = 14;
}

// 通用路上事件：场次号、冷却、已抽签的网格，以及进行中的一场和同案门人追查。
message Roadside {
  int64 cases = 1;
  int64 rest_until = 2;
  repeated int64 tiles = 3;
  RoadsideCase current = 4;
  int64 inquiry_at = 5;
  int64 inquiry_ticket = 6;
  bool inquiry_shown = 7;
  string last_ending = 8;
  map<string, int64> rest_by_kind = 9;
  map<string, RoadsideCase> last_case = 10;
  string inquiry_party = 11;
  // 以初见演员为键；不同死者的再会各自到期。
  map<string, RoadsideCase> mountain_history = 12;
}

// 伤者、唯一原卷（held 为真时仍在伤者怀里，交出、被夺或死亡掉落时先翻转再造出那一份实物）、开场预签、救护回执、本人出手、在场证人、追兵签与喝声。
message RoadsideCase {
  int64 number = 1;
  string actor = 2;
  int64 site = 3;
  int32 roll = 4;
  string stage = 5;
  string scroll = 6;
  bool healed = 7;
  bool witnessed = 8;
  int64 ticket = 9;
  bool shouted = 10;
  bool held = 11;
  bool wounded = 12;
  int64 arrived_at = 13;
  string kind = 14;
  string disciple = 15;
  string resident = 16;
  int64 refuge = 17;
  int64 last_strike = 18;
  string payment = 19;
  string victim = 20;
  bool practiced = 21;
  bool purse_dropped = 22;
  bool killed_by_owner = 23;
  bool broke_free = 24;
  string dose = 25;
  int64 quoted_units = 26;
  string ending = 27;
  string gift_item = 28;
  string followup_outcome = 29;
  string followup_leader = 30;
  bool account_heard = 31;
  string buyer = 32;
  string guardian = 33;
  int64 plant = 34;
  int32 remaining = 35;
  string return_party = 36;
  int64 return_at = 37;
  int32 carried_flowers = 38;
  // 路上实景的角色身份、货物归属及已结束的轮次随本案保存。
  map<string, string> cast = 39;
  string first_target = 40;
  string winner = 41;
  string crate_holder = 42;
  repeated string bouts = 43;
  bool renowned = 44;
  int32 warrants = 45;
  repeated string warrant_outcomes = 46;
  string banner = 47;
  bool escort_favor = 48;
  Bequest bequest = 49;
}

// 每人每庙每夜一案。货款以案号派生的 Currency 订单为准。
message MarketVisit {
  int64 altar = 1;
  int64 dawn = 2;
  bool cursed = 3;
  bool paper = 4;
  bool bought = 5;
  bool sold = 6;
  int32 serial = 7;
  bool opened = 8;
  string pursuit = 9;
  bool closed = 10;
  string parcel_request = 11;
  string relic_item = 12;
  int32 copper_price = 13;
  int32 silver_fragments = 14;
}

// 一次托付的接件地、有效佩号及人体终回执随案保存。
message Bequest {
  int64 gate = 1;
  int32 serial = 2;
  int64 due = 3;
  bool delivered = 4;
  bool overdue = 5;
  string meridian = 6;
  double credited_qi = 7;
  bytes funding_digest = 8;
  bool studied = 9;
  bool witnessed_note = 10;
}
